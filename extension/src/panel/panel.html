<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClaudeChrome Terminal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      background: #1e1e1e;
      overflow: hidden;
    }

    #terminal-container {
      height: calc(100% - 24px);
      width: 100%;
    }

    .xterm {
      height: 100% !important;
    }

    .xterm-viewport {
      overflow-y: auto !important;
    }

    .xterm-screen {
      background: #1e1e1e;
    }

    #status-bar {
      height: 24px;
      background: #007acc;
      display: flex;
      align-items: center;
      padding: 0 8px;
      font-family: "Segoe UI", sans-serif;
      font-size: 12px;
      color: #fff;
      user-select: none;
    }

    #status-text {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div id="terminal-container"></div>
  <div id="status-bar">
    <span id="status-text">Connecting...</span>
  </div>
  <script type="module" src="./panel.ts"></script>
</body>
</html>
