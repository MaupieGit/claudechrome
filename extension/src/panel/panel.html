<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClaudeChrome Terminal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      background: #1e1e1e;
      overflow: hidden;
    }

    #terminal-container {
      height: calc(100% - 24px);
      width: 100%;
    }

    #search-bar {
      position: absolute;
      top: 4px;
      right: 12px;
      display: none;
      align-items: center;
      gap: 4px;
      background: #252526;
      border: 1px solid #3e3e42;
      border-radius: 4px;
      padding: 4px 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      z-index: 5;
      font-family: "Segoe UI", sans-serif;
      font-size: 12px;
    }

    #search-bar.visible {
      display: flex;
    }

    #search-input {
      background: #1e1e1e;
      color: #d4d4d4;
      border: 1px solid #3e3e42;
      border-radius: 2px;
      padding: 3px 6px;
      width: 160px;
      font-family: inherit;
      font-size: 12px;
      outline: none;
    }

    #search-input:focus {
      border-color: #007acc;
    }

    #search-bar button {
      background: transparent;
      border: none;
      color: #cccccc;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 2px;
      font-size: 12px;
    }

    #search-bar button:hover {
      background: #3e3e42;
    }

    #search-results {
      color: #888;
      min-width: 32px;
      text-align: center;
    }

    .xterm {
      height: 100% !important;
    }

    .xterm-viewport {
      overflow-y: auto !important;
    }

    .xterm-screen {
      background: #1e1e1e;
    }

    #status-bar {
      height: 24px;
      background: #007acc;
      display: flex;
      align-items: center;
      padding: 0 8px;
      font-family: "Segoe UI", sans-serif;
      font-size: 12px;
      color: #fff;
      user-select: none;
    }

    #status-text {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #btn-popin {
      display: none;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      cursor: pointer;
      padding: 1px 8px;
      border-radius: 2px;
      font-size: 11px;
      font-family: inherit;
      margin-left: 8px;
    }

    #btn-popin.visible {
      display: inline-block;
    }

    #btn-popin:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    #session-dialog {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    #session-dialog.visible {
      display: flex;
    }

    #session-dialog-box {
      background: #252526;
      border: 1px solid #3e3e42;
      border-radius: 4px;
      padding: 20px 24px;
      text-align: center;
      min-width: 260px;
    }

    #session-dialog-box p {
      color: #cccccc;
      font-family: "Segoe UI", sans-serif;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .dialog-buttons {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .dialog-buttons button {
      padding: 6px 16px;
      font-size: 12px;
      font-family: "Segoe UI", sans-serif;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }

    #btn-resume {
      background: #007acc;
      color: #fff;
    }

    #btn-resume:hover {
      background: #1a8cdb;
    }

    #btn-new-session {
      background: #3e3e42;
      color: #cccccc;
    }

    #btn-new-session:hover {
      background: #505050;
    }
  </style>
</head>
<body>
  <div id="terminal-container"></div>
  <div id="search-bar">
    <input id="search-input" type="text" placeholder="Find" />
    <span id="search-results"></span>
    <button id="search-prev" title="Previous (Shift+Enter)">↑</button>
    <button id="search-next" title="Next (Enter)">↓</button>
    <button id="search-close" title="Close (Esc)">✕</button>
  </div>
  <div id="status-bar">
    <span id="status-text">Connecting...</span>
    <button id="btn-popin" title="Pop terminal back into a new browser window">⇱ Pop in</button>
  </div>
  <div id="session-dialog">
    <div id="session-dialog-box">
      <p id="dialog-message">A shell session is running in this tab.</p>
      <div class="dialog-buttons">
        <button id="btn-resume">Resume session</button>
        <button id="btn-new-session">New session</button>
      </div>
    </div>
  </div>
  <script type="module" src="./panel.ts"></script>
</body>
</html>
